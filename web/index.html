<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rhea</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="shell">
    <nav id="activity-bar" aria-label="Domains">
      <!-- The mark (Orbit, 2026-10-21), inlined so it takes --mark-line and
           --mark-gold from tokens.css; renderActivityBar re-inserts it ahead
           of the domains. -->
      <svg id="logo" viewBox="10 10 44 44" role="img" aria-label="Rhea">
        <path d="M49.66 26.50A18.5 18.5 0 1 1 37.50 14.34" fill="none" style="stroke:var(--mark-line)" stroke-width="2.6"/>
        <circle cx="32" cy="32" r="5.5" style="fill:var(--mark-line)"/>
        <circle cx="45.08" cy="18.92" r="7" style="fill:var(--mark-gold)"/>
      </svg>
    </nav>
    <nav id="submenu" aria-label="Functions"></nav>
    <main id="main">
      <div id="tab-bar" role="tablist"></div>
      <div id="tab-content"></div>
    </main>
  </div>
  <div id="toast" hidden></div>
  <div id="omnibox" hidden>
    <div id="omnibox-panel">
      <input id="omnibox-input" placeholder="Jump to a view — or type &gt; to run a verb" autocomplete="off">
      <div id="omnibox-results"></div>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
