<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="rhea-mark-title">
  <title id="rhea-mark-title">Rhea: a deterministic kernel connected to pieces of knowledge, one of them still a draft</title>
  <!-- Theme hooks: inherits --accent/--glow/--ink/--muted from the host page
       (web/tokens.css or an artifact); falls back to the dossier light palette
       when loaded standalone via <img>. -->
  <defs>
    <radialGradient id="rhea-glow">
      <stop offset="0%" style="stop-color:var(--glow,#1FB2D8)" stop-opacity="0.45"/>
      <stop offset="55%" style="stop-color:var(--glow,#1FB2D8)" stop-opacity="0.16"/>
      <stop offset="100%" style="stop-color:var(--glow,#1FB2D8)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="60" cy="60" r="44" fill="url(#rhea-glow)"/>

  <!-- provenance spokes -->
  <g style="stroke:var(--muted,#566971)" stroke-width="1.5" stroke-opacity="0.6">
    <line x1="75.7" y1="46.8" x2="84.5" y2="39.4"/>
    <line x1="79.8" y1="65.3" x2="95.5" y2="69.5"/>
    <line x1="65.3" y1="79.8" x2="68.4" y2="91.4"/>
    <line x1="43.2" y1="71.8" x2="32.2" y2="79.5"/>
    <line x1="41.4" y1="51.3" x2="31.0" y2="46.5"/>
    <line x1="58.2" y1="39.6" x2="56.9" y2="24.6"/>
  </g>

  <!-- the kernel: one writer, contained -->
  <circle cx="60" cy="60" r="19" fill="none" style="stroke:var(--accent,#0B7E9E)" stroke-width="3"/>
  <circle cx="60" cy="60" r="12.5" fill="none" style="stroke:var(--accent,#0B7E9E)" stroke-opacity="0.4" stroke-width="1.3" stroke-dasharray="2.5 4"/>

  <!-- pieces of knowledge: approved rules, solid -->
  <rect x="84.6" y="31.1" width="9"   height="9"   rx="2" style="fill:var(--accent,#0B7E9E)"/>
  <rect x="96.8" y="67.1" width="7.5" height="7.5" rx="2" style="fill:var(--accent,#0B7E9E)"/>
  <rect x="65.8" y="92.7" width="8"   height="8"   rx="2" style="fill:var(--accent,#0B7E9E)"/>
  <rect x="22.7" y="78.4" width="9"   height="9"   rx="2" style="fill:var(--accent,#0B7E9E)"/>
  <rect x="23.0" y="40.9" width="7"   height="7"   rx="2" style="fill:var(--accent,#0B7E9E)"/>

  <!-- one draft, still outside the gate -->
  <rect x="52.4" y="15.2" width="8" height="8" rx="2" fill="none" style="stroke:var(--accent,#0B7E9E)" stroke-width="1.5" stroke-dasharray="2.5 2.5"/>
</svg>
