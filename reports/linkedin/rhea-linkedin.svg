<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
<defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0B7E9E"/></marker></defs>
<rect width="1200" height="1500" fill="#F7F6F2"/>
<text x="80" y="110" font-family="IBM Plex Mono" font-size="20" letter-spacing="3" fill="#0B7E9E" font-weight="500">RHEA · SELF-LEARNING ENTERPRISE MANAGEMENT</text>
<text x="80" y="190" font-family="IBM Plex Sans" font-size="64" font-weight="700" fill="#13252C">AI learns rules, not facts.</text>
<text x="80" y="246" font-family="IBM Plex Sans" font-size="27" fill="#566971">Knowledge lives as data. Every rule is drafted by AI,</text>
<text x="80" y="282" font-family="IBM Plex Sans" font-size="27" fill="#566971">approved by a person, and applied the same way every time.</text>
<path d="M772.1 534.3 A300 300 0 0 1 886.9 692.3" fill="none" stroke="#0B7E9E" stroke-width="3" marker-end="url(#ah)"/><path d="M886.9 867.7 A300 300 0 0 1 772.1 1025.7" fill="none" stroke="#0B7E9E" stroke-width="3" marker-end="url(#ah)"/><path d="M427.9 1025.7 A300 300 0 0 1 313.1 867.7" fill="none" stroke="#0B7E9E" stroke-width="3" marker-end="url(#ah)"/><path d="M313.1 692.3 A300 300 0 0 1 427.9 534.3" fill="none" stroke="#0B7E9E" stroke-width="3" marker-end="url(#ah)"/>
<svg x="450" y="630" width="300" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="rhea-mark-title">
  
  
  <defs>
    <radialGradient id="rhea-glow">
      <stop offset="0%" style="stop-color:#1FB2D8" stop-opacity="0.45"/>
      <stop offset="55%" style="stop-color:#1FB2D8" stop-opacity="0.16"/>
      <stop offset="100%" style="stop-color:#1FB2D8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="60" cy="60" r="44" fill="url(#rhea-glow)"/>

  
  <g style="stroke:#566971" stroke-width="1.5" stroke-opacity="0.6">
    <line x1="75.7" y1="46.8" x2="84.5" y2="39.4"/>
    <line x1="79.8" y1="65.3" x2="95.5" y2="69.5"/>
    <line x1="65.3" y1="79.8" x2="68.4" y2="91.4"/>
    <line x1="43.2" y1="71.8" x2="32.2" y2="79.5"/>
    <line x1="41.4" y1="51.3" x2="31.0" y2="46.5"/>
    <line x1="58.2" y1="39.6" x2="56.9" y2="24.6"/>
  </g>

  
  <circle cx="60" cy="60" r="19" fill="none" style="stroke:#0B7E9E" stroke-width="3"/>
  <circle cx="60" cy="60" r="12.5" fill="none" style="stroke:#0B7E9E" stroke-opacity="0.4" stroke-width="1.3" stroke-dasharray="2.5 4"/>

  
