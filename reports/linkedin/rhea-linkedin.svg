  <rect x="96.8" y="67.1" width="7.5" height="7.5" rx="2" style="fill:#0B7E9E"/>
  <rect x="65.8" y="92.7" width="8"   height="8"   rx="2" style="fill:#0B7E9E"/>
  <rect x="22.7" y="78.4" width="9"   height="9"   rx="2" style="fill:#0B7E9E"/>
