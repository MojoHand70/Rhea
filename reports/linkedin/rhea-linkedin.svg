</svg>

<text x="600" y="930" text-anchor="middle" font-family="IBM Plex Mono" font-size="17" letter-spacing="2" fill="#566971">KNOWLEDGE AS DATA</text>
<g><rect x="435" y="416" width="330" height="128" rx="14" fill="#fff" stroke="#D9DEDF" stroke-width="1.5" />
 <text x="459" y="456" font-family="IBM Plex Mono" font-size="17" fill="#0B7E9E" font-weight="500">01</text>
 <text x="497" y="456" font-family="IBM Plex Sans" font-size="25" font-weight="600" fill="#13252C">Something new</text>
 <text x="459" y="494" font-family="IBM Plex Sans" font-size="19" fill="#566971">a business event the system</text>
 <text x="459" y="520" font-family="IBM Plex Sans" font-size="19" fill="#566971">has not seen before</text></g>
<g><rect x="775" y="716" width="330" height="128" rx="14" fill="#fff" stroke="#0B7E9E" stroke-width="2" stroke-dasharray="7 6"/>
 <text x="799" y="756" font-family="IBM Plex Mono" font-size="17" fill="#0B7E9E" font-weight="500">02</text>
 <text x="837" y="756" font-family="IBM Plex Sans" font-size="25" font-weight="600" fill="#13252C">AI drafts a rule</text>
 <text x="799" y="794" font-family="IBM Plex Sans" font-size="19" fill="#566971">a proposal, kept as data —</text>
 <text x="799" y="820" font-family="IBM Plex Sans" font-size="19" fill="#566971">never acted on directly</text></g>
<g><rect x="435" y="1016" width="330" height="128" rx="14" fill="#fff" stroke="#D9DEDF" stroke-width="1.5" />
 <text x="459" y="1056" font-family="IBM Plex Mono" font-size="17" fill="#0B7E9E" font-weight="500">03</text>
 <text x="497" y="1056" font-family="IBM Plex Sans" font-size="25" font-weight="600" fill="#13252C">A person decides</text>
 <text x="459" y="1094" font-family="IBM Plex Sans" font-size="19" fill="#566971">one approval, recorded</text>
 <text x="459" y="1120" font-family="IBM Plex Sans" font-size="19" fill="#566971">and auditable</text></g>
<g><rect x="95" y="716" width="330" height="128" rx="14" fill="#fff" stroke="#D9DEDF" stroke-width="1.5" />
 <text x="119" y="756" font-family="IBM Plex Mono" font-size="17" fill="#0B7E9E" font-weight="500">04</text>
 <text x="157" y="756" font-family="IBM Plex Sans" font-size="25" font-weight="600" fill="#13252C">The system learns</text>
 <text x="119" y="794" font-family="IBM Plex Sans" font-size="19" fill="#566971">the rule joins the corpus —</text>
 <text x="119" y="820" font-family="IBM Plex Sans" font-size="19" fill="#566971">explained and replayable</text></g>
<line x1="80" y1="1200" x2="1120" y2="1200" stroke="#D9DEDF" stroke-width="1.5"/>
<text x="80" y="1258" font-family="IBM Plex Mono" font-size="17" letter-spacing="2" fill="#566971">TRADITIONAL ERP</text>
<text x="80" y="1300" font-family="IBM Plex Sans" font-size="27" font-weight="600" fill="#13252C">Knowledge is code.</text>
<text x="80" y="1338" font-family="IBM Plex Sans" font-size="23" fill="#566971">Change means a project.</text>
<text x="640" y="1258" font-family="IBM Plex Mono" font-size="17" letter-spacing="2" fill="#0B7E9E" font-weight="500">RHEA</text>
<text x="640" y="1300" font-family="IBM Plex Sans" font-size="27" font-weight="600" fill="#13252C">Knowledge is data.</text>
<text x="640" y="1338" font-family="IBM Plex Sans" font-size="23" fill="#566971">Change means a decision.</text>
<line x1="600" y1="1236" x2="600" y2="1350" stroke="#D9DEDF" stroke-width="1.5"/>
<text x="80" y="1430" font-family="IBM Plex Sans" font-size="22" font-style="italic" fill="#566971">Every decision teaches the system once — the same question is never asked twice.</text>
</svg>